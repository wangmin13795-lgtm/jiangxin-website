# Decap CMS 配置（原 Netlify CMS）
# 已改为 GitHub 登录（适用于 Cloudflare Pages / 任意托管）
# 登录中转由仓库里的 functions/api/auth.js 提供
backend:
  name: github
  repo: wangmin13795-lgtm/jiangxin-website   # 你的GitHub用户名/仓库名
  branch: main          # 若你的仓库默认分支是 master，请改成 master
  base_url: https://jiangxin-website.pages.dev  # 改成你的 Cloudflare Pages 网址
  auth_endpoint: api/auth

# 上传的图片保存到仓库的 images/ 目录，网页中引用路径也是 images/xxx.jpg
media_folder: "images"
public_folder: "images"

locale: en

collections:
  - name: "content"
    label: "网站内容"
    files:
      - name: "site-content"
        label: "全站内容（一处改完，整站更新）"
        file: "content.json"
        fields:
          - name: company
            label: "公司名称"
            widget: object
            fields:
              - { name: name, label: "完整公司名", widget: string }
              - { name: short, label: "简称（导航/页脚用）", widget: string }
              - { name: logo, label: "Logo 图片（可选，留空显示默认 JX 方块）", widget: image, required: false, media_folder: "images/logo" }
              - { name: music, label: "背景音乐（可选，点上传按钮选电脑里的 MP3，留空则无音乐）", widget: file, required: false, media_folder: "images/music" }

          - name: theme
            label: "外观 / 配色"
            widget: object
            fields:
              - { name: bgColor, label: "页面主背景色（留空=默认白底；选色后整站生效）", widget: color, required: false, allow_input: true }
              - { name: bgAlt, label: "浅色区块底色（产品/关于等交替区块；留空=默认浅灰）", widget: color, required: false, allow_input: true }
              - { name: headerColor, label: "顶部导航栏背景色（留空=默认半透明白）", widget: color, required: false, allow_input: true }

          - name: branding
            label: "顶部导航栏 / Logo（网站标题）"
            widget: object
            fields:
              - { name: logoColor, label: "Logo 文字颜色（顶部网站名；留空=默认深色）", widget: color, required: false, allow_input: true }
              - name: logoFont
                label: "Logo 文字字体"
                widget: select
                required: false
                default: ""
                options:
                  - { label: "默认（与正文同款）", value: "" }
                  - { label: "Arial 经典无衬线", value: "Arial, sans-serif" }
                  - { label: "Georgia 优雅衬线", value: "Georgia, 'Times New Roman', serif" }
                  - { label: "Verdana 清晰宽体", value: "Verdana, Geneva, sans-serif" }
                  - { label: "Trebuchet MS 圆润", value: "'Trebuchet MS', sans-serif" }
                  - { label: "Tahoma 紧凑", value: "Tahoma, sans-serif" }
                  - { label: "Palatino 书卷衬线", value: "'Palatino Linotype', 'Book Antiqua', serif" }
              - { name: logoSize, label: "Logo 字号 px（默认 16；填 20=放大、14=缩小）", widget: number, required: false, min: 10, max: 40, value_type: int, default: 16 }
              - { name: logoBlockColor, label: "Logo 文字底色块颜色（垫在 Logo 后面的色板）", widget: color, required: false, allow_input: true }
              - { name: logoBlockOpacity, label: "Logo 底色块不透明度 %（0=不显示，建议 60-90）", widget: number, required: false, min: 0, max: 100, value_type: int, default: 0 }
              - { name: navColor, label: "导航菜单文字颜色（留空=默认深色）", widget: color, required: false, allow_input: true }

          - name: hero
            label: "首页"
            widget: object
            fields:
              - { name: eyebrow, label: "小标题", widget: string }
              - { name: title1, label: "标题第一行", widget: string }
              - { name: titleAccent, label: "标题高亮词", widget: string }
              - { name: lead, label: "引导语", widget: text }
              - { name: cta1, label: "按钮1文字", widget: string }
              - { name: cta2, label: "按钮2文字", widget: string }
              - name: trust
                label: "信任背书（可增删）"
                widget: list
                field: { name: item, label: "条目", widget: string }
              - { name: bgImage, label: "背景图片（可选，覆盖淡绿色背景）", widget: image, required: false, media_folder: "images/hero" }
              - name: bgVideo
                label: "背景视频（可选：点上传按钮选电脑里的 mp4，或填外链网址；优先于背景图片）"
                widget: file
                required: false
                media_folder: "images/hero"
                media_library:
                  config:
                    multiple: false
              - { name: bgMask, label: "遮罩强度 (0-100：0=背景最清晰，100=遮罩最重文字最清楚)", widget: number, required: false, min: 0, max: 100, default: 80 }
              - { name: panelColor, label: "文字底色块颜色（点色块弹出取色器，随意选）", widget: color, required: false, default: "#ffffff" }
              - { name: panelOpacity, label: "文字底色块深浅 (0-100：0=不显示色块，100=色块最实)", widget: number, required: false, min: 0, max: 100, default: 0 }
              - { name: textOffsetX, label: "文字整体水平移动 px（正=右移，负=左移）", widget: number, required: false, min: -300, max: 300, default: 0 }
              - { name: textOffsetY, label: "文字整体垂直移动 px（正=下移，负=上移）", widget: number, required: false, min: -300, max: 300, default: 0 }
              - { name: titleColor, label: "标题/眉标题颜色（留空用默认深色）", widget: string, required: false, hint: "可填 #155e63 这类色值，或用编辑器取色" }
              - { name: textColor, label: "正文/信任标颜色（留空用默认灰色）", widget: string, required: false, hint: "可填 #5b6b78 这类色值" }
              - { name: slideshow, label: "图片轮播开关（开=多张图逐张淡入淡出循环播放；关=全部同时显示。需放2张以上才轮播）", widget: boolean, required: false, default: false }
              - { name: slideSeconds, label: "轮播每张停留秒数（1-15秒）", widget: number, required: false, min: 1, max: 15, default: 3 }
              - name: fontFamily
                label: "全站字体（首屏文字生效）"
                widget: select
                required: false
                default: ""
                options:
                  - { label: "默认（Segoe UI 现代无衬线）", value: "" }
                  - { label: "Arial 经典无衬线", value: "Arial, sans-serif" }
                  - { label: "Georgia 优雅衬线", value: "Georgia, 'Times New Roman', serif" }
                  - { label: "Verdana 清晰宽体", value: "Verdana, Geneva, sans-serif" }
                  - { label: "Trebuchet MS 圆润", value: "'Trebuchet MS', sans-serif" }
                  - { label: "Tahoma 紧凑", value: "Tahoma, sans-serif" }
                  - { label: "Palatino 书卷衬线", value: "'Palatino Linotype', 'Book Antiqua', serif" }
              - { name: fontSize, label: "字号缩放 %（100=原大小，80=缩小两成，120=放大两成）", widget: number, required: false, min: 70, max: 140, default: 100 }
              - name: images
                label: "自由图片（可加多张，位置相对整个首屏，可分别调尺寸/位置/旋转）"
                widget: list
                summary: "{{fields.src}}"
                fields:
                  - { name: src, label: "图片", widget: image, required: false, media_folder: "images/hero" }
                  - { name: x, label: "水平位置 (0-100, 百分比)", widget: number, default: 50, required: false }
                  - { name: y, label: "垂直位置 (0-100, 百分比)", widget: number, default: 50, required: false }
                  - { name: width, label: "宽度 (占首屏宽度百分比, 建议 10-45)", widget: number, default: 20, required: false }
                  - { name: rotate, label: "旋转角度 (度, 可正可负)", widget: number, default: 0, required: false }

          - name: about
            label: "关于我们"
            widget: object
            fields:
              - { name: eyebrow, label: "小标题", widget: string }
              - { name: title, label: "标题", widget: string }
              - name: paragraphs
                label: "段落（可增删）"
                widget: list
                field: { name: text, label: "段落", widget: text }
              - name: checklist
                label: "要点清单（可增删）"
                widget: list
                field: { name: item, label: "要点", widget: string }
              - name: stats
                label: "数据卡片（可增删）"
                widget: list
                fields:
                  - { name: value, label: "数值", widget: number }
                  - { name: suffix, label: "单位/后缀", widget: string }
                  - { name: label, label: "说明文字", widget: string }
              - name: image
                label: "工厂图片或视频（可选，点上传按钮选电脑里的 mp4 或图片；留空则不显示）"
                widget: file
                required: false
                media_folder: "images/about"
                media_library:
                  config:
                    multiple: false
              - name: gallery
                label: "工厂照片墙（可加多张，点 Add 逐张添加；位置/旋转留空则用整齐网格）"
                widget: list
                required: false
                fields:
                  - { name: image, label: "照片", widget: image, media_folder: "images/about" }
                  - { name: x, label: "水平位置%(可选；填了就用自由排版)", widget: number, required: false }
                  - { name: y, label: "垂直位置%(可选)", widget: number, required: false }
                  - { name: width, label: "宽度px(可选)", widget: number, required: false }
                  - { name: rotate, label: "旋转角度(可选，如 -5)", widget: number, required: false }
              - { name: galleryColumns, label: "照片墙每行张数（2=两两成对，3=常规三列；手机上自动变单列）", widget: number, required: false, min: 1, max: 4, default: 3 }
              - { name: textColor, label: "文字颜色（段落+要点清单；留空=默认灰/深色）", widget: color, required: false, allow_input: true }
              - { name: fontSize, label: "字号缩放%（100=默认大小，可填 110 放大 / 90 缩小）", widget: number, required: false, min: 60, max: 200, value_type: int, default: 100 }
              - { name: panelColor, label: "文字底色块颜色（垫在文字后面的一块色板，配合下方不透明度一起用）", widget: color, required: false, allow_input: true }
              - { name: panelOpacity, label: "文字底色块不透明度%（0=不显示底色块，建议 60-90）", widget: number, required: false, min: 0, max: 100, value_type: int, default: 0 }
              - { name: font, label: "字体（本区块独立，不影响其他区块；留空=默认）", widget: select, required: false, default: "", options: [{ label: "默认（Segoe UI 现代无衬线）", value: "" }, { label: "Arial 经典无衬线", value: "Arial, sans-serif" }, { label: "Georgia 优雅衬线", value: "Georgia, 'Times New Roman', serif" }, { label: "Verdana 清晰宽体", value: "Verdana, Geneva, sans-serif" }, { label: "Trebuchet MS 圆润", value: "'Trebuchet MS', sans-serif" }, { label: "Tahoma 紧凑", value: "Tahoma, sans-serif" }, { label: "Palatino 书卷衬线", value: "'Palatino Linotype', 'Book Antiqua', serif" }] }
              - { name: headingColor, label: "大标题颜色（本区块 h2 大标题；留空=默认）", widget: color, required: false, allow_input: true }
              - { name: subColor, label: "小标题颜色（区块上方小标签/eyebrow；留空=默认）", widget: color, required: false, allow_input: true }

          - name: products
            label: "产品"
            widget: object
            fields:
              - { name: eyebrow, label: "小标题", widget: string }
              - { name: title, label: "标题", widget: string }
              - name: items
                label: "产品列表（可增删/排序）"
                widget: list
                fields:
                  - { name: title, label: "产品名", widget: string }
                  - { name: description, label: "描述", widget: text }
                  - { name: image, label: "产品图片（可选）", widget: image, required: false, media_folder: "images/products" }
                  - name: photos
                    label: "产品相册（可选：传了图片，产品卡上才会出现 View Photos 按钮进入图片页）"
                    widget: list
                    required: false
                    fields:
                      - { name: src, label: "图片", widget: image, required: false, media_folder: "images/products" }
                      - { name: caption, label: "图片说明（可选）", widget: string, required: false }
              - name: style
                label: "文字样式（本区块独立，不影响其他区块）"
                widget: object
                required: false
                fields:
                  - { name: font, label: "字体（留空=默认）", widget: select, required: false, default: "", options: [{ label: "默认（Segoe UI 现代无衬线）", value: "" }, { label: "Arial 经典无衬线", value: "Arial, sans-serif" }, { label: "Georgia 优雅衬线", value: "Georgia, 'Times New Roman', serif" }, { label: "Verdana 清晰宽体", value: "Verdana, Geneva, sans-serif" }, { label: "Trebuchet MS 圆润", value: "'Trebuchet MS', sans-serif" }, { label: "Tahoma 紧凑", value: "Tahoma, sans-serif" }, { label: "Palatino 书卷衬线", value: "'Palatino Linotype', 'Book Antiqua', serif" }] }
                  - { name: fontSize, label: "字号缩放 %（100=原大小，可填 110 放大 / 90 缩小）", widget: number, required: false, min: 60, max: 200, value_type: int, default: 100 }
                  - { name: headingColor, label: "大标题颜色（本区块 h2 大标题）", widget: color, required: false, allow_input: true }
                  - { name: subColor, label: "小标题颜色（区块上方小标签）", widget: color, required: false, allow_input: true }
                  - { name: textColor, label: "正文颜色（段落/描述文字）", widget: color, required: false, allow_input: true }
                  - { name: cardTitleColor, label: "卡片标题颜色（产品卡里的标题）", widget: color, required: false, allow_input: true }
                  - { name: cardTextColor, label: "卡片正文颜色（卡片里的描述文字）", widget: color, required: false, allow_input: true }
                  - { name: panelColor, label: "文字底色块颜色（垫在本区块文字后面的一块色板）", widget: color, required: false, allow_input: true }
                  - { name: panelOpacity, label: "文字底色块不透明度 %（0=不显示，建议 60-90）", widget: number, required: false, min: 0, max: 100, value_type: int, default: 0 }

          - name: why
            label: "为什么选我们"
            widget: object
            fields:
              - { name: eyebrow, label: "小标题", widget: string }
              - { name: title, label: "标题", widget: string }
              - name: items
                label: "优势列表（可增删）"
                widget: list
                fields:
                  - { name: num, label: "编号(如 01)", widget: string }
                  - { name: title, label: "标题", widget: string }
                  - { name: description, label: "描述", widget: text }
              - name: photos
                label: "板块下方配图（建议放2张，并排显示；点击可放大，留空不显示）"
                widget: list
                required: false
                fields:
                  - { name: src, label: "图片", widget: image, required: false, media_folder: "images/why" }
                  - { name: height, label: "显示窗口高度 px（留空=完整显示长图、不裁剪，如 420）", widget: number, required: false, min: 100, max: 2000, value_type: int }
                  - { name: width, label: "显示窗口宽度 px（留空=自动均分、最宽640，长图可加大如 800）", widget: number, required: false, min: 200, max: 1200, value_type: int }
                  - { name: fit, label: "设了高度后，图片超出窗口时", widget: select, required: false, default: "contain", options: [{ label: "完整显示（留白不裁剪）", value: "contain" }, { label: "填满窗口（裁掉超出部分）", value: "cover" }] }
              - name: style
                label: "文字样式（本区块独立，不影响其他区块）"
                widget: object
                required: false
                fields:
                  - { name: font, label: "字体（留空=默认）", widget: select, required: false, default: "", options: [{ label: "默认（Segoe UI 现代无衬线）", value: "" }, { label: "Arial 经典无衬线", value: "Arial, sans-serif" }, { label: "Georgia 优雅衬线", value: "Georgia, 'Times New Roman', serif" }, { label: "Verdana 清晰宽体", value: "Verdana, Geneva, sans-serif" }, { label: "Trebuchet MS 圆润", value: "'Trebuchet MS', sans-serif" }, { label: "Tahoma 紧凑", value: "Tahoma, sans-serif" }, { label: "Palatino 书卷衬线", value: "'Palatino Linotype', 'Book Antiqua', serif" }] }
                  - { name: fontSize, label: "字号缩放 %（100=原大小，可填 110 放大 / 90 缩小）", widget: number, required: false, min: 60, max: 200, value_type: int, default: 100 }
                  - { name: headingColor, label: "大标题颜色（本区块 h2 大标题）", widget: color, required: false, allow_input: true }
                  - { name: subColor, label: "小标题颜色（区块上方小标签）", widget: color, required: false, allow_input: true }
                  - { name: textColor, label: "正文颜色（段落/描述文字）", widget: color, required: false, allow_input: true }
                  - { name: panelColor, label: "文字底色块颜色（垫在本区块文字后面的一块色板）", widget: color, required: false, allow_input: true }
                  - { name: panelOpacity, label: "文字底色块不透明度 %（0=不显示，建议 60-90）", widget: number, required: false, min: 0, max: 100, value_type: int, default: 0 }

          - name: contact
            label: "联系方式"
            widget: object
            fields:
              - { name: eyebrow, label: "小标题", widget: string }
              - { name: title, label: "标题", widget: string }
              - { name: lead, label: "引导语", widget: text }
              - { name: email, label: "邮箱", widget: string }
              - { name: phone, label: "电话 / WhatsApp", widget: string }
              - { name: address, label: "地址", widget: string }
              - name: social
                label: "社媒链接（填了=图标可点击跳转；留空=灰色图标不可点）"
                widget: object
                required: false
                fields:
                  - { name: facebook, label: "Facebook 主页链接", widget: string, required: false }
                  - { name: tiktok, label: "TikTok 主页链接", widget: string, required: false }
                  - { name: instagram, label: "Instagram 主页链接", widget: string, required: false }
                  - { name: youtube, label: "YouTube 频道链接", widget: string, required: false }
              - name: style
                label: "文字样式（本区块独立，不影响其他区块）"
                widget: object
                required: false
                fields:
                  - { name: font, label: "字体（留空=默认）", widget: select, required: false, default: "", options: [{ label: "默认（Segoe UI 现代无衬线）", value: "" }, { label: "Arial 经典无衬线", value: "Arial, sans-serif" }, { label: "Georgia 优雅衬线", value: "Georgia, 'Times New Roman', serif" }, { label: "Verdana 清晰宽体", value: "Verdana, Geneva, sans-serif" }, { label: "Trebuchet MS 圆润", value: "'Trebuchet MS', sans-serif" }, { label: "Tahoma 紧凑", value: "Tahoma, sans-serif" }, { label: "Palatino 书卷衬线", value: "'Palatino Linotype', 'Book Antiqua', serif" }] }
                  - { name: fontSize, label: "字号缩放 %（100=原大小，可填 110 放大 / 90 缩小）", widget: number, required: false, min: 60, max: 200, value_type: int, default: 100 }
                  - { name: headingColor, label: "大标题颜色（本区块 h2 大标题）", widget: color, required: false, allow_input: true }
                  - { name: subColor, label: "小标题颜色（区块上方小标签）", widget: color, required: false, allow_input: true }
                  - { name: textColor, label: "正文颜色（引导语等）", widget: color, required: false, allow_input: true }
                  - { name: cardTitleColor, label: "表单标签颜色", widget: color, required: false, allow_input: true }
                  - { name: cardTextColor, label: "表单输入文字颜色", widget: color, required: false, allow_input: true }
                  - { name: panelColor, label: "文字底色块颜色（垫在本区块文字后面的一块色板）", widget: color, required: false, allow_input: true }
                  - { name: panelOpacity, label: "文字底色块不透明度 %（0=不显示，建议 60-90）", widget: number, required: false, min: 0, max: 100, value_type: int, default: 0 }

          - name: process
            label: "生产流程（= 首页 HOW WE WORK 六步流程）"
            widget: object
            fields:
              - { name: eyebrow, label: "小标题", widget: string }
              - { name: title, label: "标题", widget: string }
              - name: steps
                label: "流程步骤（可增删/排序）"
                widget: list
                fields:
                  - { name: num, label: "编号(如 01)", widget: string }
                  - { name: title, label: "标题", widget: string }
                  - { name: desc, label: "描述", widget: text }
              - name: style
                label: "文字样式（本区块独立，不影响其他区块）"
                widget: object
                required: false
                fields:
                  - { name: font, label: "字体（留空=默认）", widget: select, required: false, default: "", options: [{ label: "默认（Segoe UI 现代无衬线）", value: "" }, { label: "Arial 经典无衬线", value: "Arial, sans-serif" }, { label: "Georgia 优雅衬线", value: "Georgia, 'Times New Roman', serif" }, { label: "Verdana 清晰宽体", value: "Verdana, Geneva, sans-serif" }, { label: "Trebuchet MS 圆润", value: "'Trebuchet MS', sans-serif" }, { label: "Tahoma 紧凑", value: "Tahoma, sans-serif" }, { label: "Palatino 书卷衬线", value: "'Palatino Linotype', 'Book Antiqua', serif" }] }
                  - { name: fontSize, label: "字号缩放 %（100=原大小，可填 110 放大 / 90 缩小）", widget: number, required: false, min: 60, max: 200, value_type: int, default: 100 }
                  - { name: headingColor, label: "大标题颜色（本区块 h2 大标题）", widget: color, required: false, allow_input: true }
                  - { name: subColor, label: "小标题颜色（区块上方小标签）", widget: color, required: false, allow_input: true }
                  - { name: textColor, label: "正文颜色（段落/描述文字）", widget: color, required: false, allow_input: true }
                  - { name: cardTitleColor, label: "卡片标题颜色（步骤卡里的标题）", widget: color, required: false, allow_input: true }
                  - { name: cardTextColor, label: "卡片正文颜色（卡片里的描述文字）", widget: color, required: false, allow_input: true }
                  - { name: panelColor, label: "文字底色块颜色（垫在本区块文字后面的一块色板）", widget: color, required: false, allow_input: true }
                  - { name: panelOpacity, label: "文字底色块不透明度 %（0=不显示，建议 60-90）", widget: number, required: false, min: 0, max: 100, value_type: int, default: 0 }

          - name: galleries
            label: "公司场景图库（首页卡片 + 二级页）"
            widget: object
            fields:
              - { name: eyebrow, label: "小标题", widget: string }
              - { name: title, label: "标题", widget: string }
              - { name: intro, label: "引导语", widget: text }
              - name: categories
                label: "相册分类（可增删/排序）"
                widget: list
                fields:
                  - { name: slug, label: "英文标识(如 team-building，勿含空格)", widget: string }
                  - { name: title, label: "分类名", widget: string }
                  - { name: subtitle, label: "副标题", widget: string }
                  - { name: cover, label: "封面图（可选）", widget: image, required: false, media_folder: "images/scenes" }
                  - name: images
                    label: "图片（可增删，每张可写说明）"
                    widget: list
                    fields:
                      - { name: src, label: "图片", widget: image, required: false, media_folder: "images/scenes" }
                      - { name: caption, label: "图片说明", widget: string, required: false }
